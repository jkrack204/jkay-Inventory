document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

clearTimeout(this._st); this._st = setTimeout(()=>this.setState({toast:null}), 2600); }\n  }\n  settingsVals(){\n    const s = this.state, c = this.cfg();\n    const lows = this.items().filter(i => this.isLeaf(i) && this.isLow(i.id, this.state.loc));\n    return {\n      settingsOpen: !!s.settings,\n      openSettings: () => this.setState({settings: true}),\n      closeSettings: () => this.setState({settings: false}),\n      themeTabs: [{k:'light',label:'Light'},{k:'dark',label:'Dark'},{k:'system',label:'System'}].map(t => ({\n        label: t.label,\n        bg: (c.theme || 'system') === t.k ? 'var(--surface)' : 'transparent',\n        color: (c.theme || 'system') === t.k ? 'var(--ink)' : 'var(--ink-4)',\n        shadow: (c.theme || 'system') === t.k ? '0 1px 2px var(--sh-c)' : 'none',\n        pick: () => this.setCfg({theme: t.k}, t.label + ' appearance')\n      })),\n      densityTabs: [{k:'comfortable',label:'Comfortable'},{k:'compact',label:'Compact'}].map(t => ({\n        label: t.label,\n        bg: c.density === t.k ? 'var(--surface)' : 'transparent',\n        color: c.density === t.k ? 'var(--ink)' : 'var(--ink-4)',\n        shadow: c.density === t.k ? '0 1px 2px var(--sh-c)' : 'none',\n        pick: () => this.setCfg({density: t.k}, t.label + ' rows')\n      })),\n      toggles: [\n        {k:'hideZero', label:'Hide items at zero', note:'Keeps empty rows out of the table.'},\n        {k:'expandAll', label:'Open every category by default', note:'The tree starts fully expanded.'}\n      ].map(t => ({\n        label: t.label, note: t.note,\n        trackBg: c[t.k] ? 'var(--good)' : 'var(--track-off)',\n        knobLeft: c[t.k] ? '21px' : '3px',\n        flip: () => this.setCfg({[t.k]: !c[t.k]}, t.label + (c[t.k] ? ' off' : ' on'))\n      })),\n      lowInfo: (c.lowStock || 0) > 0\n        ? 'Admin flags anything at or below ' + this.num(c.lowStock) + '. ' + this.num(lows.length) + ' item' + (lows.length === 1 ? '' : 's') + ' low here right now.'\n        : 'Admin has alerts switched off.'\n    };\n  }\n\n  num(n){ return (n||0).toLocaleString('en-IN'); }\n  items(){ return this.state.store.items; }\n  byId(id){ return this.items().filter(i => i.id === id)[0]; }\n  kids(id){ return this.items().filter(i => i.parent === id); }\n  isLeaf(it){ return !it.group && this.kids(it.id).length === 0; }\n  leavesUnder(it){\n    if (this.isLeaf(it)) return [it];\n    return this.kids(it.id).reduce((a,k) => a.concat(this.leavesUnder(k)), []);\n  }\n  onHand(it, loc){\n    const L = loc || this.state.loc;\n    return this.leavesUnder(it).reduce((s,l) => s + (this.state.store.stock[l.id + ':' + L] || 0), 0);\n  }\n  unitOf(it){\n    const u = {};\n    this.leavesUnder(it).forEach(l => { if (l.unit) u[l.unit] = 1; });\n    const k = Object.keys(u);\n    return k.length === 1 ? k[0] : k.length === 0 ? '' : 'mixed';\n  }\n  path(it){\n    const parts = [];\n    let p = it.parent;\n    while (p) { const n = this.byId(p); if (!n) break; parts.unshift(n.name); p = n.parent; }\n    return parts.join(' › ');\n  }\n  locName(id){ return (window.JKAY_V2.LOCATIONS.filter(l => l.id === id)[0] || {}).name || ''; }\n  otherLoc(){ return this.state.loc === 1 ? 2 : 1; }\n\n  leaves(kind){ return this.items().filter(i => i.kind === kind && i.loc === this.state.loc && this.isLeaf(i)); }\n\n  // Item picker, divided parent-wise: one group per category that directly holds items.\n  pickGroups(){\n    const s = this.state, pq = (s.pickQuery || '').trim().toLowerCase();\n    const groups = [];\n    const rec = (parent) => {\n      const nodes = this.items().filter(i => i.kind === s.pickKind && i.loc === s.loc && i.parent === parent);\n      const leaves = nodes.filter(n => this.isLeaf(n));\n      if (leaves.length) {\n        const p = parent ? this.byId(parent) : null;\n        const rows = leaves\n          .filter(l => !pq || (l.name + ' ' + this.path(l)).toLowerCase().indexOf(pq) >= 0)\n          .map(l => this.pickOption(l));\n        if (rows.length) groups.push({\n          name: p ? p.name : 'Top level',\n          path: p ? (this.path(p) || '') : '',\n          count: this.num(rows.length) + (rows.length === 1 ? ' item' : ' items'),\n          rows\n        });\n      }\n      nodes.filter(n => !this.isLeaf(n)).forEach(n => rec(n.id));\n    };\n    rec(null);\n    return groups;\n  }\n\n  pickOption(l){\n    const s = this.state, lq = this.onHand(l);\n    return {\n      name: l.name, path: this.path(l), qty: this.num(lq), unit: l.unit || '',\n      qcolor: lq === 0 ? 'var(--bad)' : 'var(--ink)',\n      border: s.pick === l.id ? 'var(--accent)' : 'var(--border-2)',\n      bg: s.pick === l.id ? 'var(--accent-tint-2)' : 'var(--surface)',\n      pick: () => this.setState({pick: l.id, step: 2, qtyStr: ''}),\n      staged: this.cartQty(l.id) > 0 ? this.num(this.cartQty(l.id)) + ' on this DC' : ''\n    };\n  }\n\n  openSheet(dir, itemId){\n    const it = itemId ? this.byId(itemId) : null;\n    this.setState({\n      dir, pick: itemId || null, step: itemId ? 2 : 1,\n      pickKind: it ? it.kind : this.state.tab, pickQuery: '',\n      qtyStr: '', ptext: '', vehicle: '', address: '', note: '', cart: []\n    });\n  }\n\n  press(k){\n    let q = this.state.qtyStr;\n    if (k === 'del') q = q.slice(0, -1);\n    else if (k === 'clr') q = '';\n    else if (k === '.') { if (q.indexOf('.') < 0 && q) q = q + '.'; }\n    else if (q.replace('.','').length < 7) q = (q === '0' ? '' : q) + k;\n    this.setState({qtyStr: q});\n  }\n  bump(n){\n    const cur = parseFloat(this.state.qtyStr || '0') || 0;\n    this.setState({qtyStr: String(cur + n)});\n  }\n\n  qtyNum(){ const n = parseFloat(this.state.qtyStr); return isNaN(n) ? 0 : n; }\n\n  resolvedParty(){ return (this.state.ptext || '').trim(); }\n  vehicleNo(){ return (this.state.vehicle || '').trim().toUpperCase(); }\n  addressTxt(){ return (this.state.address || '').trim(); }\n  // Input needs party + vehicle; output also needs an address.\n  dcReady(){\n    if (this.state.dir === 'in') return true;\n    return !!this.resolvedParty() && !!this.vehicleNo() && !!this.addressTxt();\n  }\n\n  // A DC carries one or more lines. Older single-item rows are read through dcLines().\n  dcLines(d){ return d.lines && d.lines.length ? d.lines : [{itemId: d.itemId, qty: d.qty}]; }\n  dcQtyTotal(d){ return this.dcLines(d).reduce((a,l) => a + l.qty, 0); }\n\n  cart(){ return this.state.cart || []; }\n  cartQty(itemId){ return this.cart().reduce((a,l) => a + (l.itemId === itemId ? l.qty : 0), 0); }\n  // Adds the keypad figure as a line; merges into an existing line for the same item.\n  stageLine(){\n    const s = this.state, q = this.qtyNum();\n    if (!s.pick || q <= 0) return false;\n    const cart = this.cart().slice();\n    const at = cart.findIndex(l => l.itemId === s.pick);\n    if (at >= 0) cart[at] = {itemId: s.pick, qty: cart[at].qty + q};\n    else cart.push({itemId: s.pick, qty: q});\n    this.setState({cart, pick: null, qtyStr: '', pickQuery: ''});\n    return true;\n  }\n  lineOver(l){\n    return this.state.dir === 'out' && l.qty > this.onHand(this.byId(l.itemId));\n  }\n\n  record(){\n    const s = this.state, party = this.resolvedParty(), lines = this.cart();\n    if (!lines.length || !this.dcReady()) return;\n    if (lines.some(l => this.lineOver(l))) return;\n\n    const store = JSON.parse(JSON.stringify(s.store));\n    lines.forEach(l => {\n      const key = l.itemId + ':' + s.loc;\n      store.stock[key] = (store.stock[key] || 0) + (s.dir === 'in' ? l.qty : -l.qty);\n    });\n    const id = store.nextDc++;\n    const ref = 'DC-' + String(id).padStart(4, '0');\n    const now = new Date();\n    const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n    store.dcs.push({\n      id, ref, loc: s.loc, dir: s.dir,\n      lines: lines.map(l => ({itemId: l.itemId, qty: l.qty})),\n      itemId: lines[0].itemId, qty: lines[0].qty,\n      party: s.dir === 'in' ? '' : party,\n      vehicle: s.dir === 'in' ? '' : this.vehicleNo(),\n      address: s.dir === 'in' ? '' : this.addressTxt(),\n      note: s.dir === 'in'\n        ? (s.note || '').trim()\n        : [this.vehicleNo(), this.addressTxt()].filter(Boolean).join(' · '),\n      date: String(now.getDate()).padStart(2,'0') + ' ' + MO[now.getMonth()],\n      time: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0')\n    });\n\n    const first = this.byId(lines[0].itemId);\n    const rest = lines.length - 1;\n    this.setState({dir: null, cart: []});\n    this.commit(store,\n      (s.dir === 'in' ? 'Input DC ' : 'Output DC ') + ref + ' recorded · '\n        + this.num(lines[0].qty) + ' ' + (first.unit||'') + ' ' + first.name\n        + (rest ? ' + ' + this.num(rest) + ' more item' + (rest === 1 ? '' : 's') : ''),\n      id);\n  }\n\n  // Every column draws a continuing stem; the last column adds a rounded elbow into this row.\n  guides(trail){\n    const t = (trail || []).slice(1), line = 'var(--border-3)';\n    return t.map((cont, i) => ({\n      stemColor: cont ? line : 'transparent',\n      elbowColor: i === t.length - 1 ? line : 'transparent'\n    }));\n  }\n\n  rowsFor(){\n    const s = this.state, out = [], q = s.query.trim().toLowerCase();\n    if (q) {\n      this.items().filter(i => i.kind === s.tab && i.loc === this.vLoc() && this.isLeaf(i) && i.name.toLowerCase().indexOf(q) >= 0)\n        .filter(it => !this.cfg().hideZero || this.onHand(it, this.vLoc()) > 0)\n        .forEach(it => out.push(this.row(it, 0, true, [])));\n      return out;\n    }\n    const walk = (parent, depth, trail) => {\n      const list = this.items().filter(i => i.kind === s.tab && i.loc === this.vLoc() && i.parent === parent)\n        .filter(it => !this.cfg().hideZero || this.onHand(it, this.vLoc()) > 0);\n      list.forEach((it, k) => {\n        const t = trail.concat(k < list.length - 1);\n        out.push(this.row(it, depth, false, t));\n        if (!this.isLeaf(it) && this.isOpen(it.id)) walk(it.id, depth + 1, t);\n      });\n    };\n    walk(null, 0, []);\n    return out;\n  }\n\n  row(it, depth, flat, trail){\n    const leaf = this.isLeaf(it), qty = this.onHand(it, this.vLoc()), unit = this.unitOf(it);\n    const tight = this.cfg().density === 'compact';\n    const idx = depth;\n    const zero = leaf && qty === 0;\n    const open = this.isOpen(it.id);\n    return {\n      name: it.name,\n      sub: flat ? this.path(it) : leaf ? (it.unit || '') : this.num(this.leavesUnder(it).length) + ' items below · rolled up',\n      pad: (depth * 20) + 'px',\n      guides: this.guides(trail),\n      rail: depth === 0 && !leaf ? (it.kind === 'm' ? 'var(--accent)' : 'var(--good)') : 'transparent',\n      dotColor: zero ? 'var(--bad)' : 'var(--dot)',\n      dotRing: zero ? 'var(--bad-tint)' : 'var(--tint)',\n      isLeaf: leaf, isParent: !leaf,\n      caret: open ? '90deg' : '0deg',\n      caretBg: open ? 'var(--accent-tint)' : 'var(--surface)',\n      caretBorder: open ? 'var(--accent-border)' : 'var(--border)',\n      caretColor: open ? 'var(--accent)' : 'var(--ink-4)',\n      vpad: tight ? '9px' : '14px',\n      toggle: () => this.setState(st => ({open: {...st.open, [it.id]: !st.open[it.id]}})),\n      fsize: tight ? (leaf ? '15px' : '16px') : leaf ? '16px' : depth === 0 ? '19.5px' : '17px',\n      ftrack: depth === 0 && !leaf ? '-.005em' : '0',\n      fweight: leaf ? '500' : depth === 0 ? '700' : '600',\n      fcolor: leaf ? 'var(--ink-2)' : 'var(--ink)',\n      qty: this.num(qty),\n      unit: unit === 'mixed' ? 'mixed units' : unit,\n      qsize: tight ? '15px' : leaf ? '16.5px' : '17.5px',\n      qcolor: zero ? 'var(--bad)' : leaf ? 'var(--ink)' : 'var(--ink-3)',\n      low: leaf && this.isLow(it.id, this.vLoc()),\n      showActions: leaf && this.ownView(),\n      bg: leaf ? 'transparent' : depth === 0 ? 'var(--surface-2)' : 'var(--tint-2)',\n      rule: depth === 0 && !leaf ? 'var(--border-2)' : 'var(--rule-2)',\n      anim: 'rowIn 300ms cubic-bezier(.2,.7,.3,1) both;animation-delay:' + Math.min(idx * 14 + 20, 260) + 'ms',\n      outBorder: zero ? 'var(--border-2)' : 'var(--accent-border-2)',\n      outBg: zero ? 'var(--field-2)' : 'var(--accent-tint-2)',\n      outColor: zero ? 'var(--muted-2)' : 'var(--accent)',\n      inDc: () => this.openSheet('in', it.id),\n      outDc: () => { if (!zero) this.openSheet('out', it.id); }\n    };\n  }\n\n  sheetVals(){\n    const s = this.state;\n    const it = s.pick ? this.byId(s.pick) : null;\n    const dirIn = s.dir === 'in';\n    const q = this.qtyNum();\n    const have = it ? this.onHand(it) : 0;\n    const after = dirIn ? have + q : have - q;\n    const unit = it ? (it.unit || '') : '';\n    const party = this.resolvedParty();\n    const over = !dirIn && (q + this.cartQty(s.pick)) > have;\n\n    const stepDefs = [{n:1,label:'Item'},{n:2,label:'Quantity'},{n:3,label:dirIn ? 'Note' : 'Party & vehicle'}];\n    const kinds = [{k:'m',label:'Materials'},{k:'c',label:'Consumables'}];\n    const groups = this.pickGroups();\n    const options = groups.reduce((a, g) => a.concat(g.rows), []);\n\n    const keyDef = ['1','2','3','4','5','6','7','8','9','.','0','del'];\n    const keys = keyDef.map(k => ({\n      label: k === 'del' ? '⌫' : k,\n      border: k === 'del' ? 'var(--border-2)' : 'var(--border)',\n      bg: k === 'del' ? 'var(--field-2)' : 'var(--surface)',\n      color: k === 'del' ? 'var(--ink-4)' : 'var(--ink)',\n      press: () => this.press(k)\n    }));\n\n    const staged = this.cart();\n    const short = staged.filter(l => this.lineOver(l));\n    let preview = '', previewBg = 'var(--tint)', previewBorder = 'var(--border-2)', previewColor = 'var(--ink-3)';\n    if (!staged.length) preview = 'Add at least one item to this DC.';\n    else if (short.length) {\n      const names = short.map(l => this.byId(l.itemId).name).join(', ');\n      preview = this.locName(s.loc) + ' does not hold enough ' + names + ' for an Output DC.';\n      previewBg = 'var(--bad-tint)'; previewBorder = 'var(--bad-border)'; previewColor = 'var(--bad)';\n    } else if (!dirIn && !party) preview = 'Enter the party name.';\n    else if (!dirIn && !this.addressTxt()) preview = 'Enter the delivery address for ' + party + '.';\n    else if (!dirIn && !this.vehicleNo()) preview = 'Vehicle number is required on an Output DC.';\n    else {\n      const totalQty = staged.reduce((a,l) => a + l.qty, 0);\n      preview = this.num(staged.length) + (staged.length === 1 ? ' item · ' : ' items · ') + this.num(totalQty)\n        + ' units ' + (dirIn ? 'into ' : 'out of ') + this.locName(s.loc)\n        + (dirIn ? ' on one DC. A note is optional.' : ' on one DC · vehicle ' + this.vehicleNo() + '.');\n    }\n\n    const cart = this.cart();\n    const badLine = cart.some(l => this.lineOver(l));\n    const ready3 = this.dcReady() && cart.length > 0 && !badLine;\n    let primaryLabel = 'Choose an item', canNext = false;\n    if (s.step === 1) { primaryLabel = it ? 'Continue' : 'Choose an item'; canNext = !!it; }\n    if (s.step === 2) { primaryLabel = q > 0 ? 'Continue' : 'Enter a quantity'; canNext = q > 0 && !over; }\n    if (s.step === 3) { primaryLabel = ready3 ? (dirIn ? 'Record Input DC' : 'Record Output DC') : (cart.length ? 'Fill in the details' : 'Add an item'); canNext = ready3; }\n\n    return {\n      glyph: dirIn ? '↓' : '↑',\n      badgeBg: dirIn ? 'var(--good)' : 'var(--accent)',\n      title: dirIn ? 'Input DC' : 'Output DC',\n      sub: (dirIn ? 'Arriving at ' : 'Leaving ') + this.locName(s.loc),\n      steps: stepDefs.map(sd => ({\n        label: sd.label,\n        fill: s.step >= sd.n ? (dirIn ? 'var(--good)' : 'var(--accent)') : 'var(--border-2)',\n        color: s.step >= sd.n ? 'var(--ink-3)' : 'var(--muted-2)'\n      })),\n      onStep1: s.step === 1, onStep2: s.step === 2, onStep3: s.step === 3,\n      kindTabs: kinds.map(k => ({\n        label: k.label,\n        bg: s.pickKind === k.k ? 'var(--surface)' : 'transparent',\n        color: s.pickKind === k.k ? 'var(--ink)' : 'var(--ink-4)',\n        shadow: s.pickKind === k.k ? '0 1px 2px var(--sh-c)' : 'none',\n        pick: () => this.setState({pickKind: k.k})\n      })),\n      pickQuery: s.pickQuery,\n      onPickQuery: e => this.setState({pickQuery: e.target.value}),\n      groups, options, noOptions: options.length === 0,\n      itemName: it ? it.name : '', itemPath: it ? this.path(it) : '', unit,\n      qtyDisplay: s.qtyStr === '' ? '0' : s.qtyStr,\n      qtyColor: s.qtyStr === '' ? 'var(--muted-2)' : over ? 'var(--bad)' : 'var(--ink)',\n      qtyHint: dirIn\n        ? 'On hand ' + this.num(have) + ' ' + unit + ' → ' + this.num(after) + ' after this DC.'\n        : over ? 'Only ' + this.num(have) + ' ' + unit + ' on hand — an Output DC cannot exceed that.'\n        : 'On hand ' + this.num(have) + ' ' + unit + ' → ' + this.num(after) + ' after this DC.',\n      hintColor: over ? 'var(--bad)' : 'var(--ink-4)',\n      quick: [5, 10, 25, 50].map(n => ({label: '+' + n, press: () => this.bump(n)}))\n        .concat([{label: 'Clear', press: () => this.press('clr')}]),\n      keys,\n      partyLabel: dirIn ? 'Party name — who it came from' : 'Party name — who it is going to',\n      ptext: s.ptext || '',\n      textPlaceholder: dirIn ? 'Supplier or party name' : 'Customer or party name',\n      onPtext: e => this.setState({ptext: e.target.value}),\n      partyBorder: party ? 'var(--border)' : 'var(--bad-border)',\n      showDetails: !dirIn,\n      showNote: dirIn,\n      note: s.note || '',\n      onNote: e => this.setState({note: e.target.value}),\n      showAddress: !dirIn,\n      address: s.address || '',\n      onAddress: e => this.setState({address: e.target.value}),\n      addressBorder: this.addressTxt() ? 'var(--border)' : 'var(--bad-border)',\n      vehicle: s.vehicle || '',\n      onVehicle: e => this.setState({vehicle: e.target.value}),\n      vehicleBorder: this.vehicleNo() ? 'var(--border)' : 'var(--bad-border)',\n      preview, previewBg, previewBorder, previewColor,\n      cart: cart.map(l => {\n        const li = this.byId(l.itemId), bad = this.lineOver(l);\n        return {\n          name: li.name,\n          sub: bad ? 'only ' + this.num(this.onHand(li)) + ' on hand here' : this.path(li),\n          subColor: bad ? 'var(--bad)' : 'var(--muted)',\n          bg: bad ? 'var(--bad-tint-3)' : 'var(--surface)',\n          qty: this.num(l.qty), unit: li.unit || '',\n          remove: () => this.setState({cart: this.cart().filter(x => x.itemId !== l.itemId)})\n        };\n      }),\n      cartCount: cart.length ? this.num(cart.length) + (cart.length === 1 ? ' item' : ' items') : 'nothing yet',\n      addAnother: () => this.setState({step: 1, pick: null, qtyStr: '', pickQuery: ''}),\n      showAddMore: s.step === 2,\n      addMore: () => { if (q > 0 && !over) { this.stageLine(); this.setState({step: 1}); } },\n      addMoreBorder: q > 0 && !over ? 'var(--accent-border)' : 'var(--border)',\n      addMoreColor: q > 0 && !over ? 'var(--accent)' : 'var(--muted-2)',\n      canBack: s.step > 1,\n      back: () => this.setState({step: s.step === 3 ? 1 : s.step - 1, pick: null, qtyStr: ''}),\n      primaryLabel,\n      primaryBg: canNext ? (dirIn ? 'var(--good)' : 'var(--accent)') : 'var(--track)',\n      primaryBorder: canNext ? (dirIn ? 'var(--good)' : 'var(--accent)') : 'var(--border)',\n      primaryColor: canNext ? '#fff' : 'var(--muted)',\n      primary: () => {\n        if (!canNext) return;\n        if (s.step === 3) { this.record(); return; }\n        // Leaving the keypad banks the line, so step 3 always reads from the cart.\n        if (s.step === 2) { this.stageLine(); this.setState({step: 3}); return; }\n        this.setState({step: s.step + 1});\n      }\n    };\n  }\n\n  activityVals(){\n    const s = this.state;\n    const q = (s.dcQuery || '').trim().toLowerCase();\n    const dir = s.dcDir || 'all';\n    let list = s.store.dcs.filter(d => d.loc === s.loc && (dir === 'all' || d.dir === dir));\n    if (q) list = list.filter(d => {\n      const names = this.dcLines(d).map(l => (this.byId(l.itemId) || {name: ''}).name).join(' ');\n      return (d.ref + ' ' + names + ' ' + d.party + ' ' + (d.note || '')).toLowerCase().indexOf(q) >= 0;\n    });\n    list = list.slice().reverse();\n    if (!q && dir === 'all') list = list.slice(0, 8);\n    return list.map((d, i) => {\n      const lines = this.dcLines(d);\n      const first = this.byId(lines[0].itemId) || {name: 'item', unit: ''};\n      const many = lines.length > 1;\n      const isIn = d.dir === 'in';\n      return {\n        glyph: isIn ? '↓' : '↑',\n        bg: isIn ? 'var(--good-tint)' : 'var(--accent-tint-2)',\n        color: isIn ? 'var(--good)' : 'var(--accent)',\n        qty: many\n          ? this.num(this.dcQtyTotal(d)) + ' units'\n          : this.num(lines[0].qty) + ' ' + (first.unit || ''),\n        label: many\n          ? first.name + ' + ' + this.num(lines.length - 1) + ' more'\n          : first.name,\n        meta: isIn ? (d.note || 'Received into stock') : ('to ' + d.party + (d.note ? ' · ' + d.note : '')),\n        ref: d.ref,\n        when: d.date + ' · ' + d.time,\n        anim: s.flash === d.id\n          ? 'flashRow 1500ms ease-out both, rowIn 300ms cubic-bezier(.2,.7,.3,1) both'\n          : 'rowIn 300ms cubic-bezier(.2,.7,.3,1) both;animation-delay:' + Math.min(i * 22, 200) + 'ms'\n      };\n    });\n  }\n\n  moveOf(id){\n    const loc = this.state.loc;\n    let inQ = 0, outQ = 0, n = 0;\n    this.state.store.dcs.forEach(d => {\n      if (d.loc !== loc) return;\n      const q = this.dcLines(d).filter(l => l.itemId === id).reduce((a,l) => a + l.qty, 0);\n      if (!q) return;\n      n++;\n      if (d.dir === 'in') inQ += q; else outQ += q;\n    });\n    return {inQ, outQ, n};\n  }\n\n  // One item's history at this desk only — quantities, never rates.\n  bookVals(id){\n    const it = this.byId(id);\n    if (!it) return {};\n    const loc = this.state.loc;\n    const qOf = (d) => this.dcLines(d).filter(l => l.itemId === id).reduce((x,l) => x + l.qty, 0);\n    const list = this.state.store.dcs.filter(d => d.loc === loc && qOf(d) > 0);\n    const net = list.reduce((a,d) => a + (d.dir === 'in' ? qOf(d) : -qOf(d)), 0);\n    const held = this.stockOf(id, loc);\n    const unit = it.unit || '';\n    let bal = held - net;\n    const rows = list.map(d => {\n      const q = qOf(d), isIn = d.dir === 'in';\n      bal += isIn ? q : -q;\n      const lines = this.dcLines(d).length;\n      return {\n        date: d.date, ref: d.ref,\n        glyph: isIn ? '↓' : '↑',\n        tagBg: isIn ? 'var(--good-tint)' : 'var(--accent-tint-2)',\n        tagColor: isIn ? 'var(--good)' : 'var(--accent)',\n        party: isIn ? (d.party || d.note || 'Stock received') : (d.party || '—'),\n        meta: (isIn ? 'Input DC' : 'Output DC') + ' · ' + d.time\n          + (lines > 1 ? ' · ' + this.num(lines) + ' items on this challan' : '')\n          + (d.vehicle ? ' · ' + d.vehicle : ''),\n        inQty: isIn ? this.num(q) : '—',\n        outQty: isIn ? '—' : this.num(q),\n        balance: this.num(bal),\n        open: () => this.setState({dcView: d.id})\n      };\n    }).reverse();\n    const opening = held - net;\n    return {\n      name: it.name, path: this.path(it) || 'Top level', loc: this.locName(loc),\n      opening: (opening < 0 ? '−' + this.num(Math.abs(opening)) : this.num(opening)) + ' ' + unit,\n      openingColor: opening < 0 ? 'var(--bad)' : 'var(--ink)',\n      openingNote: opening < 0 ? '· short against recorded DCs' : '· before the DCs below',\n      closing: this.num(held) + ' ' + unit,\n      totalIn: this.num(list.filter(d => d.dir === 'in').reduce((a,d) => a + qOf(d), 0)),\n      totalOut: this.num(list.filter(d => d.dir === 'out').reduce((a,d) => a + qOf(d), 0)),\n      rows, empty: rows.length === 0,\n      stats: [\n        {label: 'on hand · ' + unit, value: this.num(held), color: held === 0 ? 'var(--bad)' : 'var(--invert-ink)'},\n        {label: 'challans', value: this.num(list.length), color: 'var(--invert-ink)'},\n        {label: 'inwards', value: this.num(list.filter(d => d.dir === 'in').reduce((a,d) => a + qOf(d), 0)), color: 'var(--invert-ink)'},\n        {label: 'outwards', value: this.num(list.filter(d => d.dir === 'out').reduce((a,d) => a + qOf(d), 0)), color: 'var(--invert-ink)'}\n      ]\n    };\n  }\n\n  dcVals(dcId){\n    const d = this.state.store.dcs.filter(x => x.id === dcId)[0];\n    if (!d) return {};\n    const isIn = d.dir === 'in';\n    const fields = [\n      {label: 'Challan no.', value: d.ref},\n      {label: 'Date', value: d.date + ' · ' + d.time},\n      {label: 'Type', value: isIn ? 'Inwards — material received' : 'Outwards — material dispatched'},\n      {label: isIn ? 'Received at' : 'Dispatched from', value: this.locName(d.loc)}\n    ];\n    if (!isIn) {\n      fields.push({label: 'Party', value: d.party || '—'});\n      fields.push({label: 'Delivery address', value: d.address || '—'});\n      fields.push({label: 'Vehicle no.', value: d.vehicle || '—'});\n    } else if (d.party) {\n      fields.push({label: 'Received from', value: d.party});\n    }\n    return {\n      ref: d.ref, when: d.date + ' · ' + d.time,\n      tag: isIn ? 'Inwards' : 'Outwards',\n      locLine: this.locName(d.loc) + ' · ' + (isIn ? 'inwards challan' : 'outwards challan'),\n      fields,\n      lines: this.dcLines(d).map((l, i) => {\n        const it = this.byId(l.itemId) || {name: 'Removed item', unit: ''};\n        return {\n          sr: String(i + 1).padStart(2, '0'),\n          name: it.name, path: this.path(it) || 'Top level',\n          qty: this.num(l.qty) + ' ' + (it.unit || '')\n        };\n      }),\n      totalQty: this.num(this.dcQtyTotal(d)),\n      note: d.note || (isIn ? 'Received into stock.' : 'No remarks recorded.')\n    };\n  }\n\n  bookListVals(){\n    const s = this.state, loc = s.loc;\n    const q = (s.bookQuery || '').trim().toLowerCase();\n    const all = this.items().filter(i => this.isLeaf(i) && i.loc === loc)\n      .slice().sort((x, y) => x.name.localeCompare(y.name));\n    const rows = all\n      .filter(x => !q || (x.name + ' ' + this.path(x)).toLowerCase().indexOf(q) >= 0)\n      .map(x => {\n        const mv = this.moveOf(x.id), held = this.stockOf(x.id, loc);\n        return {\n          name: x.name, path: this.path(x) || 'Top level', unit: x.unit || '',\n          qty: this.num(held),\n          qtyColor: held === 0 ? 'var(--bad)' : 'var(--ink)',\n          dotColor: held === 0 ? 'var(--bad)' : 'var(--dot)',\n          dotRing: held === 0 ? 'var(--bad-tint)' : 'var(--tint)',\n          inQty: mv.inQ ? '+' + this.num(mv.inQ) : '—',\n          outQty: mv.outQ ? '−' + this.num(mv.outQ) : '—',\n          dcCount: this.num(mv.n),\n          open: () => this.setState({book: x.id})\n        };\n      });\n    return {\n      bookRows: rows, noBooks: rows.length === 0,\n      bookCount: q ? this.num(rows.length) + ' of ' + this.num(all.length) + ' items' : this.num(all.length) + ' items',\n      bookQuery: s.bookQuery || '',\n      setBookQuery: (e) => this.setState({bookQuery: e.target.value}),\n      onBooks: s.page === 'books',\n      goBooks: () => this.setState({page: 'books', book: null, dcView: null}),\n      bookOpen: !!s.book, book: s.book ? this.bookVals(s.book) : {},\n      closeBook: () => this.setState({book: null}),\n      dcOpen: !!s.dcView, dc: s.dcView ? this.dcVals(s.dcView) : {},\n      closeDc: () => this.setState({dcView: null})\n    };\n  }\n\n  alertVals(){\n    const loc = this.state.loc;\n    const rows = this.items().filter(i => this.isLeaf(i) && i.loc === loc)\n      .filter(i => this.stockOf(i.id, loc) === 0 || this.isLow(i.id, loc))\n      .map(i => {\n        const held = this.stockOf(i.id, loc), out = held === 0;\n        return {\n          name: i.name,\n          sub: (this.path(i) || 'top level') + ' · ' + (out\n            ? 'nothing on hand'\n            : 'alert set at ' + this.num(this.lowLimit(i.id)) + ' ' + (i.unit || '') + ' and below'),\n          state: out ? 'Out' : 'Low',\n          dot: out ? 'var(--bad)' : 'var(--accent)',\n          tagBg: out ? 'var(--bad-tint)' : 'var(--accent-tint)',\n          tagColor: out ? 'var(--bad)' : 'var(--accent)',\n          qty: this.num(held) + ' ' + (i.unit || '')\n        };\n      });\n    const outs = rows.filter(r => r.state === 'Out').length;\n    return {\n      alerts: rows, hasAlerts: rows.length > 0, noAlerts: rows.length === 0,\n      alertBtnLabel: outs\n        ? this.num(outs) + ' out of stock'\n        : rows.length ? this.num(rows.length) + ' running low' : 'Stock alerts',\n      alertBtnBorder: rows.length ? 'var(--bad-border)' : 'var(--border)',\n      alertBtnBg: rows.length ? 'var(--bad-tint-2)' : 'var(--surface)',\n      alertBtnColor: rows.length ? 'var(--bad)' : 'var(--ink-3)',\n      alertCount: this.num(outs) + ' out of stock · ' + this.num(rows.length - outs)\n        + ' below the alert · at ' + this.locName(loc)\n    };\n  }\n\n  renderVals(){\n    if (!this.state.ready) return {};\n    const s = this.state;\n    const rows = this.rowsFor();\n    const activity = this.activityVals();\n    const anyOpen = Object.keys(s.open).some(k => s.open[k]);\n\n    return {\n      locName: this.locName(s.loc),\n      dotColor: 'var(--good)',\n      otherHint: 'Fabrication keeps its own stock',\n      tabs: [{k:'m',label:'Materials'},{k:'c',label:'Consumables'}].map(t => ({\n        label: t.label,\n        bg: s.tab === t.k ? 'var(--surface)' : 'transparent',\n        color: s.tab === t.k ? 'var(--ink)' : 'var(--ink-4)',\n        shadow: s.tab === t.k ? '0 1px 2px var(--sh-c)' : 'none',\n        pick: () => this.setState({tab: t.k})\n      })),\n      tabNoun: s.tab === 'm' ? 'Material' : 'Consumable',\n      query: s.query,\n      onQuery: e => this.setState({query: e.target.value}),\n      toggleAllLabel: anyOpen ? 'Collapse all' : 'Expand all',\n      toggleAll: () => {\n        if (anyOpen) { this.setState({open: {}}); return; }\n        const open = {};\n        this.items().filter(i => !this.isLeaf(i)).forEach(i => { open[i.id] = true; });\n        this.setState({open});\n      },\n      showStock: (s.page || 'desk') === 'desk' || s.page === 'other',\n      goOther: () => this.setState({page: 'other'}),\n      otherBtnBorder: s.page === 'other' ? 'var(--accent-border)' : 'var(--border)',\n      otherBtnBg: s.page === 'other' ? 'var(--accent-tint)' : 'var(--surface)',\n      otherBtnColor: s.page === 'other' ? 'var(--accent)' : 'var(--ink-3)',\n      onDesk: (s.page || 'desk') === 'desk',\n      onAlerts: s.page === 'alerts',\n      goAlerts: () => this.setState({page: 'alerts'}),\n      goDesk: () => this.setState({page: 'desk'}),\n      viewLocName: this.locName(this.vLoc()),\n      viewingOther: !this.ownView(),\n      otherBanner: this.locName(this.vLoc()) + ' stock — read only. DCs are raised at that desk.',\n      ...this.alertVals(),\n      ...this.bookListVals(),\n      bookBtnBorder: s.page === 'books' ? 'var(--accent-border)' : 'var(--border)',\n      bookBtnBg: s.page === 'books' ? 'var(--accent-tint)' : 'var(--surface)',\n      bookBtnColor: s.page === 'books' ? 'var(--accent)' : 'var(--ink-3)',\n      rows, hasRows: rows.length > 0, noRows: rows.length === 0,\n      activity, noActivity: activity.length === 0,\n      dcQuery: s.dcQuery || '',\n      setDcQuery: (e) => this.setState({dcQuery: e.target.value}),\n      dcDirTabs: [{k:'all',label:'All'},{k:'in',label:'In'},{k:'out',label:'Out'}].map(t => ({\n        label: t.label,\n        bg: (s.dcDir || 'all') === t.k ? 'var(--surface)' : 'transparent',\n        color: (s.dcDir || 'all') === t.k ? 'var(--ink)' : 'var(--ink-4)',\n        shadow: (s.dcDir || 'all') === t.k ? '0 1px 2px var(--sh-c)' : 'none',\n        pick: () => this.setState({dcDir: t.k})\n      })),\n      emptyMsg: ((s.dcQuery || '').trim() || (s.dcDir || 'all') !== 'all')\n        ? 'No DCs match that filter.'\n        : 'No DCs logged at ' + this.locName(s.loc) + ' yet.',\n      dcCount: (() => {\n        const all = s.store.dcs.filter(d => d.loc === s.loc).length;\n        const filtered = ((s.dcQuery || '').trim() || (s.dcDir || 'all') !== 'all');\n        return filtered ? this.num(activity.length) + ' of ' + this.num(all) : this.num(all) + ' logged';\n      })(),\n      startIn: () => this.openSheet('in', null),\n      startOut: () => this.openSheet('out', null),\n      sheetOpen: !!s.dir,\n      closeSheet: () => this.setState({dir: null}),\n      sheet: s.dir ? this.sheetVals() : {},\n      ...this.settingsVals(),\n      toast: s.toast, hasToast: !!s.toast\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
